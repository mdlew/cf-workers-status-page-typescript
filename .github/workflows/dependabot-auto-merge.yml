name: Dependabot auto-merge

# Trigger on pull request events (opened, synchronized, reopened)
# This allows auto-merge to be re-evaluated when PRs are updated
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

  build:
    runs-on: ubuntu-latest
    needs: dependabot
    if: needs.dependabot.outputs.update-type == 'version-update:semver-minor'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install --global pnpm

      - name: Check minor update build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  manage:
    runs-on: ubuntu-latest
    needs: [dependabot, build]
    if: >-
      always() &&
      needs.dependabot.result == 'success' &&
      (
        (needs.dependabot.outputs.update-type == 'version-update:semver-minor' && needs.build.result == 'success') ||
        needs.dependabot.outputs.update-type == 'version-update:semver-patch' ||
        needs.dependabot.outputs.update-type == 'version-update:semver-major'
      )
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge for minor updates
        if: needs.dependabot.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "${{ github.event.pull_request.head.sha }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for merge and dispatch deployment
        if: needs.dependabot.outputs.update-type == 'version-update:semver-minor'
        run: |
          for attempt in {1..360}; do
            state="$(gh pr view "$PR_URL" --json state --jq '.state')"
            if [[ "$state" == "MERGED" ]]; then
              gh workflow run publish.yml --ref master
              exit 0
            fi
            if [[ "$state" == "CLOSED" ]]; then
              echo "The Dependabot PR was closed without merging."
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for the Dependabot PR to merge."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on patch updates
        if: needs.dependabot.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr comment "$PR_URL" --body "✅ **Dependabot patch update detected**

          This PR updates dependencies with a patch version change and is left for manual review.

          Please ensure that the application still builds and runs as expected before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major version updates
        if: needs.dependabot.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🔍 **Major version update detected**

          This PR contains a major version update which may include breaking changes.
          Please review the changelog and test thoroughly before merging.

          To merge this PR, manually review and approve it."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label Dependabot PRs
        # Add helpful labels based on update type
        # Only runs when UPDATE_TYPE matches one of the expected semver types
        # Continue on error if labels don't exist in the repository
        continue-on-error: true
        if: |
          needs.dependabot.outputs.update-type == 'version-update:semver-major' ||
          needs.dependabot.outputs.update-type == 'version-update:semver-minor' ||
          needs.dependabot.outputs.update-type == 'version-update:semver-patch'
        run: |
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            gh pr edit "$PR_URL" --add-label "major-update"
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            gh pr edit "$PR_URL" --add-label "minor-update"
          else
            gh pr edit "$PR_URL" --add-label "patch-update"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ needs.dependabot.outputs.update-type }}
